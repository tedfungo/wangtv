<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="renderer" content="webkit">
    <meta name="force-rendering" content="webkit">
    <meta name="x5-fullscreen" content="true">
    <meta name="x5-page-mode" content="app">
    <title>黃敬波播放器-雙模智能版</title>
    <script src="cordova.js"></script>
    <script src="mpegts.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 24px;
            background-color: #121212;
            color: #ffffff;
            overflow-x: hidden;
        }

        body.fullscreen-active {
            padding: 0 !important;
            overflow: hidden !important;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 30px;
        }

        h4 {
            margin-bottom: 20px;
            font-size: 22px;
            color: #ffeb3b;
        }

        /* 內建播放器容器（平時隱藏，降級用 WebView 播放時彈出全螢幕） */
        .player-box {
            display: none;
            width: 100%;
            height: 0;
            padding-top: 56.25%;
            background-color: #000;
            border-radius: 8px;
            margin-bottom: 20px;
            position: relative;
        }

        .player-box.fullscreen-mode {
            display: block !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            padding-top: 0 !important;
            z-index: 99999 !important;
            border-radius: 0 !important;
            margin: 0 !important;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            -webkit-transform: translate3d(0,0,0);
            transform: translate3d(0,0,0);
        }

        video::-webkit-media-controls {
            display: none !important;
        }

        .btn-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 20px;
        }

        button.channel-btn {
            padding: 20px;
            font-size: 18px;
            background-color: #1e1e1e;
            color: white;
            border: 2px solid #333;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            outline: none;
            transition: all 0.15s ease-in-out;
        }

        button.channel-btn:focus, button.channel-btn:hover {
            background-color: #1565c0;
            border-color: #ffeb3b;
            box-shadow: 0 0 16px rgba(255, 235, 59, 0.6);
            transform: scale(1.02);
        }

        .status {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <h4><img src="icon.png" alt="图标" style="width: 36px; height: 36px; vertical-align: middle; margin-right: 8px;"> 黃敬波專線 <-- 有事找他(主謀)</h4>
    <div class="status" id="statusText">請選擇頻道：優先拉起 VLC，未響應則自動切換內建播放</div>

    <!-- 內建播放器（降級備援用） -->
    <div class="player-box" id="playerBox">
        <video id="videoElement" playsinline webkit-playsinline autoplay></video>
    </div>

    <div class="btn-list">
        <button class="channel-btn" onclick="playStream('https://pull-mpeg-hs-cny-f5.douyincdn.com/live/wxxw-3KNpWhZ0lSaCroTIRf32AqSYbUwjAwyruHsc0KnmLY9yXhj7rXECcu39xKd5mFXyUsByfemjtbwjXDeC.flv', 'TVB 無線新聞台')">📺 TVB 無線新聞台</button>
        <button class="channel-btn" onclick="playStream('https://pull-mpeg-hs-cny-f5.douyincdn.com/live/fc-LMbEPJe5MloHcHvTs0DXowNztiTYo2GRWYiVFay2sAZ2aS0fGq5Kt0DDbOEz7DNrVLal4xICqjotPlDR.flv', '翡翠台')">📺 翡翠台</button> 
        <button class="channel-btn" onclick="playStream('https://pull-mpeg-hs-cny-f5.douyincdn.com/live/mz-aPTLe8wju0pBb0EPZiT1wBoCkL566W82rJASM9YJ8gq8NNkXUO3JbqYgHWWbNGxaireDJpvw0d1PaFTU.flv', '明珠台')">📺 明珠台</button>
        <button class="channel-btn" onclick="playStream('https://pull-mpeg-hs-cny-f5.douyincdn.com/live/viu-WaLq7QU9ShukSHJr4y4T8i0dBsztO66q6niwBKsG86utDGp8t7H3cr1oB0VrNxkL9efg3iOLGlGf8AfS.flv', 'ViuTV')">📺 ViuTV</button>
        <button class="channel-btn" onclick="playStream('https://pull-mpeg-hs-cny-f5.douyincdn.com/live/viu6-8gdcevMEDtjXMHhJXHP7ziGkkBezFqkpFtA72x8msWRDKvudDTC1VXpsTgqVF2DObATSVpEhjQjy9RnI.flv', 'ViuTV 6')">📺 ViuTV 6</button>
        <button class="channel-btn" onclick="playStream('https://pull-mpeg-hs-cny-f5.douyincdn.com/live/76-oUvaxF7M45U9SmoSSOg3f66we7BLzbEeFQvxlraqoUVvZk2JQtFWJJAZ9lfo5QROX7APb6DjmR9Cr1EE.flv', 'HOY76')">📺 HOY76</button>
        <button class="channel-btn" onclick="playStream('https://pull-mpeg-hs-cny-f5.douyincdn.com/live/77-UEX24z1szkkYW1MgvLHM2x3dzaLhlIRcGClmIhA2Sqwk3zfZ1Ib6qHLeUDAyzFqUGTbZeymM3aDDutDW.flv', 'HOY77')">📺 HOY77</button>
        <button class="channel-btn" onclick="playStream('https://pull-mpeg-hs-cny-f5.douyincdn.com/live/78-kyg843KLeAipWh193dzAxvA5AaogPevepNR9XdaDz6BQMR18AW5zTd5uYuaSAsMJxRu9nw8mcMZJyoBG.flv', 'HOY78 新聞台')">📺 HOY78 新聞台</button>
    </div>
</div>

<script>
    let flvPlayer = null;

    function playStream(url, name) {
        const statusText = document.getElementById('statusText');
        statusText.innerText = '正在嘗試呼叫 VLC 播放：' + name + '...';

        let vlcLaunched = false;

        // 1. 優先嘗試透過 WebIntent 呼叫 VLC
        if (window.plugins && window.plugins.webintent) {
            window.plugins.webintent.startActivity({
                action: 'android.intent.action.VIEW',
                url: url,
                type: 'video/*',
                package: 'org.videolan.vlc',
                component: {
                    package: 'org.videolan.vlc',
                    class: 'org.videolan.vlc.gui.video.VideoPlayerActivity'
                },
                extras: {
                    'title': name
                }
            }, function() {
                vlcLaunched = true;
                statusText.innerText = '已成功切換至 VLC 播放：' + name;
            }, function(e) {
                console.log('VLC 呼叫未成功，準備降級', e);
            });
        }

        // 2. 智慧防護網：1.2秒內若 App 沒進入背景（代表 VLC 沒被成功拉起），自動無縫降級用內建 WebView 播放！
        setTimeout(() => {
            if (!vlcLaunched && !document.hidden) {
                statusText.innerText = 'VLC 未回應，已自動切換內建高清播放：' + name;
                startNativeWebPlayer(url, name);
            }
        }, 1200);
    }

    // 內建 WebView 降級播放函式
    function startNativeWebPlayer(url, name) {
        const playerBox = document.getElementById('playerBox');
        const videoElement = document.getElementById('videoElement');

        playerBox.classList.add('fullscreen-mode');
        document.body.classList.add('fullscreen-active');

        if (flvPlayer) {
            flvPlayer.pause();
            flvPlayer.unload();
            flvPlayer.detachMediaElement();
            flvPlayer.destroy();
            flvPlayer = null;
        }

        videoElement.muted = false;
        videoElement.volume = 1.0;

        if (window.mpegts && mpegts.getFeatureList().mseLivePlayback) {
            flvPlayer = mpegts.createPlayer({
                type: 'flv',
                isLive: true,
                hasAudio: true,
                hasVideo: true,
                url: url
            }, {
                enableStashBuffer: true,
                stashInitialSize: 512 * 1024,
                liveBufferLatencyChasing: false,
                autoCleanupSourceBuffer: true,
                enableWorker: false,
                lazyLoad: false
            });

            flvPlayer.attachMediaElement(videoElement);
            flvPlayer.load();
            
            flvPlayer.play().catch(err => {
                console.warn('播放受阻，降級靜音播放', err);
                videoElement.muted = true;
                flvPlayer.play().catch(e => console.log(e));
            });
        }
    }

    // 遙控器返回鍵 / Esc 退出內建全屏
    window.addEventListener('keydown', (e) => {
        if (e.keyCode === 27 || e.keyCode === 4 || e.key === 'Escape' || e.key === 'Backspace') {
            const playerBox = document.getElementById('playerBox');
            if (playerBox.classList.contains('fullscreen-mode')) {
                e.preventDefault();
                if (flvPlayer) {
                    flvPlayer.pause();
                    flvPlayer.unload();
                    flvPlayer.detachMediaElement();
                    flvPlayer.destroy();
                    flvPlayer = null;
                }
                playerBox.classList.remove('fullscreen-mode');
                document.body.classList.remove('fullscreen-active');
                document.getElementById('statusText').innerText = '已退出播放，請選擇頻道';
            }
        }
    });

    window.addEventListener('DOMContentLoaded', () => {
        const firstBtn = document.querySelector('.channel-btn');
        if (firstBtn) firstBtn.focus();
    });
</script>

</body>
</html>
