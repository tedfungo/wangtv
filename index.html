<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="renderer" content="webkit">
    <meta name="force-rendering" content="webkit">
    <meta name="x5-fullscreen" content="true">
    <meta name="x5-page-mode" content="app">
    <title>黃敬波播放器-純電視盒版</title>
    <script src="cordova.js"></script>
    <script src="mpegts.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 24px;
            background-color: #121212;
            color: #ffffff;
            overflow-x: hidden;
        }

        body.fullscreen-active {
            padding: 0 !important;
            overflow: hidden !important;
            background-color: #000;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h4 {
            margin: 0 0 12px 0;
            font-size: 24px;
            color: #ffeb3b;
        }

        /* 柔和、精簡的模式切換按鈕 */
        .control-panel {
            margin-bottom: 16px;
        }

        button.mode-toggle-btn {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: normal;
            background-color: #1e1e1e;
            color: #b0bec5;
            border: 1px solid #424242;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
            transition: all 0.15s ease-in-out;
        }

        button.mode-toggle-btn:focus, button.mode-toggle-btn:hover {
            background-color: #2c2c2c;
            color: #ffffff;
            border-color: #ffeb3b;
        }

        .status {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 20px;
        }

        /* 頻道按鈕網格排版（適合遙控器大字體聚焦） */
        .btn-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        button.channel-btn {
            padding: 24px;
            font-size: 20px;
            background-color: #1e1e1e;
            color: white;
            border: 3px solid #333;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            outline: none;
            transition: all 0.15s ease-in-out;
        }

        button.channel-btn:focus, button.channel-btn:hover {
            background-color: #1565c0;
            border-color: #ffeb3b;
            box-shadow: 0 0 20px rgba(255, 235, 59, 0.7);
            transform: scale(1.02);
        }

        /* 內建 WebView 全屏播放容器 */
        .player-box {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 99999;
        }

        .player-box.active {
            display: block !important;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
        }

        video::-webkit-media-controls {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <h4><img src="icon.png" alt="圖標" style="width: 36px; height: 36px; vertical-align: middle; margin-right: 8px;"> 黃敬波專線 <-- 有事找他(主謀)</h4>
    
    <!-- 精簡柔和的播放模式切換按鈕 -->
    <div class="control-panel">
        <button id="modeToggleBtn" class="mode-toggle-btn" onclick="togglePlayMode()">
            ⚙️ 播放模式：載入中...
        </button>
    </div>

    <div class="status" id="statusText">正在從伺服器同步最新頻道清單...</div>

    <!-- 頻道按鈕動態生成區域 -->
    <div class="btn-list" id="btnList"></div>
</div>

<!-- 內建全屏播放彈窗 -->
<div class="player-box" id="playerBox">
    <video id="videoElement" playsinline webkit-playsinline autoplay></video>
</div>

<script>
    let flvPlayer = null;
    let syncTimer = null;
    let isPlayingInternal = false;
    let useVLC = true; // 預設使用 VLC
    const DATA_JS_URL = 'http://n6000.lithoconcepts.com:7222/data.js';

    window.addEventListener('DOMContentLoaded', () => {
        const savedMode = localStorage.getItem('player_use_vlc');
        if (savedMode !== null) {
            useVLC = (savedMode === 'true');
        }
        updateModeButtonUI();
        loadRemoteData();
    });

    function updateModeButtonUI() {
        const btn = document.getElementById('modeToggleBtn');
        if (useVLC) {
            btn.innerText = '⚙️ 播放模式：[外部 VLC] (點擊切換為內建引擎)';
        } else {
            btn.innerText = '⚙️ 播放模式：[純內建引擎·防聲畫不同步] (點擊切換為VLC)';
        }
    }

    function togglePlayMode() {
        useVLC = !useVLC;
        localStorage.setItem('player_use_vlc', useVLC);
        updateModeButtonUI();
    }

    function loadRemoteData() {
        const statusText = document.getElementById('statusText');
        statusText.innerText = '正在從伺服器同步最新頻道清單...';

        const script = document.createElement('script');
        script.src = DATA_JS_URL + '?t=' + new Date().getTime(); 
        
        const timer = setTimeout(() => {
            statusText.innerText = '同步超時：請檢查電視網路連線';
        }, 5000);

        script.onload = () => clearTimeout(timer);
        script.onerror = (err) => {
            clearTimeout(timer);
            statusText.innerText = '遠端清單同步失敗：網路請求受阻';
            console.error('Script load error:', err);
        };

        document.head.appendChild(script);
    }

    function loadChannelData(text) {
        const statusText = document.getElementById('statusText');
        const btnList = document.getElementById('btnList');
        btnList.innerHTML = '';

        const lines = text.trim().split('\n');
        let count = 0;

        lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) return;

            const parts = trimmed.split(';');
            if (parts.length >= 2) {
                const name = parts[0].trim();
                const url = parts.slice(1).join(';').trim();

                const btn = document.createElement('button');
                btn.className = 'channel-btn';
                btn.innerText = '📺 ' + name;
                btn.onclick = () => playStream(url, name);
                btnList.appendChild(btn);
                count++;
            }
        });

        if (count > 0) {
            statusText.innerText = '請選擇頻道';
            const firstBtn = btnList.querySelector('.channel-btn');
            if (firstBtn) firstBtn.focus();
        } else {
            statusText.innerText = '頻道清單內容為空';
        }
    }

    function playStream(url, name) {
        const statusText = document.getElementById('statusText');

        if (useVLC) {
            statusText.innerText = '正在嘗試呼叫 VLC 全屏播放：' + name + '...';
            let vlcLaunched = false;

            if (window.plugins && window.plugins.webintent) {
                window.plugins.webintent.startActivity({
                    action: 'android.intent.action.VIEW',
                    url: url,
                    type: 'video/*',
                    package: 'org.videolan.vlc',
                    component: {
                        package: 'org.videolan.vlc',
                        class: 'org.videolan.vlc.gui.video.VideoPlayerActivity'
                    },
                    extras: {
                        'title': name,
                        'from_start': true,
                        'position': 0,
                        'network_caching': 150,
                        'hardware_acceleration': 1,
                        'audio_delay': 0
                    }
                }, function() {
                    vlcLaunched = true;
                    statusText.innerText = '已成功啟動 VLC 播放：' + name;
                }, function(e) {
                    console.log('VLC 呼叫未成功，準備降級', e);
                });
            }

            setTimeout(() => {
                if (!vlcLaunched && !document.hidden) {
                    statusText.innerText = '未偵測到 VLC，自動切換內建引擎全屏播放：' + name;
                    startInternalFullscreenPlayer(url, name);
                }
            }, 1200);

        } else {
            statusText.innerText = '使用內建引擎全屏播放：' + name;
            startInternalFullscreenPlayer(url, name);
        }
    }

    function startInternalFullscreenPlayer(url, name) {
        const playerBox = document.getElementById('playerBox');
        const videoElement = document.getElementById('videoElement');
        const statusText = document.getElementById('statusText');

        statusText.innerText = '正在全屏播放： ' + name;
        playerBox.classList.add('active');
        document.body.classList.add('fullscreen-active');
        isPlayingInternal = true;

        destroyPlayer();

        videoElement.muted = false;
        videoElement.volume = 1.0;

        if (window.mpegts && mpegts.getFeatureList().mseLivePlayback) {
            flvPlayer = mpegts.createPlayer({
                type: 'flv',
                isLive: true,
                hasAudio: true,
                hasVideo: true,
                url: url
            }, {
                enableStashBuffer: true,
                stashInitialSize: 192 * 1024,
                liveBufferLatencyChasing: true,
                liveBufferLatencyMaxLatency: 1.0,
                liveBufferLatencyMinRemain: 0.2,
                fixAudioTimestampGap: true,
                autoCleanupSourceBuffer: true,
                enableWorker: false,
                lazyLoad: false
            });

            flvPlayer.attachMediaElement(videoElement);
            flvPlayer.load();
            
            flvPlayer.play().catch(err => {
                console.warn('播放受阻，降級靜音播放', err);
                videoElement.muted = true;
                flvPlayer.play().catch(e => console.log(e));
            });

            syncTimer = setInterval(() => {
                if (videoElement && videoElement.buffered.length > 0) {
                    const end = videoElement.buffered.end(videoElement.buffered.length - 1);
                    const diff = end - videoElement.currentTime;
                    if (diff > 0.8) {
                        videoElement.currentTime = end - 0.15;
                    }
                }
            }, 1500);

        } else {
            videoElement.src = url;
            videoElement.play().catch(e => {
                videoElement.muted = true;
                videoElement.play();
            });
        }
    }

    function destroyPlayer() {
        if (syncTimer) {
            clearInterval(syncTimer);
            syncTimer = null;
        }
        if (flvPlayer) {
            try {
                flvPlayer.pause();
                flvPlayer.unload();
                flvPlayer.detachMediaElement();
                flvPlayer.destroy();
            } catch (e) {
                console.log(e);
            }
            flvPlayer = null;
        }
    }

    // 攔截 Cordova 原生返回鍵事件（專治 Android TV 遙控器返回直接關閉 App）
    document.addEventListener("backbutton", function (e) {
        if (isPlayingInternal) {
            e.preventDefault();
            e.stopPropagation();
            
            const playerBox = document.getElementById('playerBox');
            playerBox.classList.remove('active');
            document.body.classList.remove('fullscreen-active');
            
            destroyPlayer();
            
            const videoElement = document.getElementById('videoElement');
            videoElement.pause();
            videoElement.src = "";
            videoElement.load();
            
            isPlayingInternal = false;
            document.getElementById('statusText').innerText = '已退出播放，請選擇頻道';
            
            setTimeout(() => {
                const firstBtn = document.querySelector('.channel-btn');
                if (firstBtn) firstBtn.focus();
            }, 100);
        } else {
            // 在首頁時允許正常退出 App
            if (navigator.app && navigator.app.exitApp) {
                navigator.app.exitApp();
            }
        }
    }, false);
</script>

</body>
</html>
