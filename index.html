<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="renderer" content="webkit">
    <meta name="force-rendering" content="webkit">
    <meta name="x5-fullscreen" content="true">
    <meta name="x5-page-mode" content="app">
    <title>黃敬波播放器-雙模智能版</title>
    <script src="cordova.js"></script>
    <script src="mpegts.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 24px;
            background-color: #121212;
            color: #ffffff;
            overflow-x: hidden;
        }

        body.fullscreen-active {
            padding: 0 !important;
            overflow: hidden !important;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 30px;
        }

        h4 {
            margin-bottom: 20px;
            font-size: 22px;
            color: #ffeb3b;
        }

        /* 內建播放器容器（平時隱藏，播放時彈出全螢幕） */
        .player-box {
            display: none;
            width: 100%;
            height: 0;
            padding-top: 56.25%;
            background-color: #000;
            border-radius: 8px;
            margin-bottom: 20px;
            position: relative;
        }

        .player-box.fullscreen-mode {
            display: block !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            padding-top: 0 !important;
            z-index: 99999 !important;
            border-radius: 0 !important;
            margin: 0 !important;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            -webkit-transform: translate3d(0,0,0);
            transform: translate3d(0,0,0);
        }

        video::-webkit-media-controls {
            display: none !important;
        }

        .btn-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 20px;
        }

        button.channel-btn {
            padding: 20px;
            font-size: 18px;
            background-color: #1e1e1e;
            color: white;
            border: 2px solid #333;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            outline: none;
            transition: all 0.15s ease-in-out;
        }

        button.channel-btn:focus, button.channel-btn:hover {
            background-color: #1565c0;
            border-color: #ffeb3b;
            box-shadow: 0 0 16px rgba(255, 235, 59, 0.6);
            transform: scale(1.02);
        }

        .status {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <h4><img src="icon.png" alt="圖標" style="width: 36px; height: 36px; vertical-align: middle; margin-right: 8px;"> 黃敬波專線 <-- 有事找他(主謀)</h4>
    <div class="status" id="statusText">正在從伺服器同步最新頻道清單...</div>

    <!-- 內建播放器 -->
    <div class="player-box" id="playerBox">
        <video id="videoElement" playsinline webkit-playsinline autoplay controls></video>
    </div>

    <!-- 頻道按鈕動態生成區域 -->
    <div class="btn-list" id="btnList"></div>
</div>

<script>
    let flvPlayer = null;
    const DATA_JS_URL = 'http://n6000.lithoconcepts.com:7222/data.js';

    window.addEventListener('DOMContentLoaded', () => {
        loadRemoteData();
    });

    function loadRemoteData() {
        const statusText = document.getElementById('statusText');
        statusText.innerText = '正在從伺服器同步最新頻道清單...';

        const script = document.createElement('script');
        script.src = DATA_JS_URL + '?t=' + new Date().getTime(); 
        
        const timer = setTimeout(() => {
            statusText.innerText = '同步超時：請檢查網路連線';
        }, 5000);

        script.onload = () => clearTimeout(timer);
        script.onerror = (err) => {
            clearTimeout(timer);
            statusText.innerText = '遠端清單同步失敗：網路請求受阻';
            console.error('Script load error:', err);
        };

        document.head.appendChild(script);
    }

    function loadChannelData(text) {
        const statusText = document.getElementById('statusText');
        const btnList = document.getElementById('btnList');
        btnList.innerHTML = '';

        const lines = text.trim().split('\n');
        let count = 0;

        lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) return;

            const parts = trimmed.split(';');
            if (parts.length >= 2) {
                const name = parts[0].trim();
                const url = parts.slice(1).join(';').trim();

                const btn = document.createElement('button');
                btn.className = 'channel-btn';
                btn.innerText = '📺 ' + name;
                btn.onclick = () => playStream(url, name);
                btnList.appendChild(btn);
                count++;
            }
        });

        if (count > 0) {
            statusText.innerText = '請選擇頻道';
            const firstBtn = btnList.querySelector('.channel-btn');
            if (firstBtn) firstBtn.focus();
        } else {
            statusText.innerText = '頻道清單內容為空';
        }
    }

    // 判斷當前裝置是否為 Android TV / 電視盒
    function isAndroidTV() {
        const ua = navigator.userAgent;
        // 常見電視盒 UA 特徵或大螢幕
        return /Android/.test(ua) && (/TV|Leanback|GoogleTV|Amlogic|Rockchip/i.test(ua) || window.innerWidth > 1024);
    }

    function playStream(url, name) {
        const statusText = document.getElementById('statusText');

        // 如果是手機或平板：直接走內建 WebView 播放，不呼叫 VLC
        if (!isAndroidTV()) {
            statusText.innerText = '正在以內建播放器播放：' + name;
            startNativeWebPlayer(url, name);
            return;
        }

        // 以下維持電視盒專屬的雙模智能邏輯（有 VLC 用 VLC，沒 VLC 降級內建）
        statusText.innerText = '正在嘗試呼叫 VLC 播放：' + name + '...';
        let vlcLaunched = false;

        if (window.plugins && window.plugins.webintent) {
            window.plugins.webintent.startActivity({
                action: 'android.intent.action.VIEW',
                url: url,
                type: 'video/*',
                package: 'org.videolan.vlc',
                component: {
                    package: 'org.videolan.vlc',
                    class: 'org.videolan.vlc.gui.video.VideoPlayerActivity'
                },
                extras: {
                    'title': name
                }
            }, function() {
                vlcLaunched = true;
                statusText.innerText = '已成功切換至 VLC 播放：' + name;
            }, function(e) {
                console.log('VLC 呼叫未成功，準備降級', e);
            });
        }

        setTimeout(() => {
            if (!vlcLaunched && !document.hidden) {
                statusText.innerText = '未偵測到 VLC，自動切換電視內建播放：' + name;
                startNativeWebPlayer(url, name);
            }
        }, 1200);
    }

    // 內建 WebView / mpegts 播放函式
    function startNativeWebPlayer(url, name) {
        const playerBox = document.getElementById('playerBox');
        const videoElement = document.getElementById('videoElement');

        playerBox.classList.add('fullscreen-mode');
        document.body.classList.add('fullscreen-active');

        if (flvPlayer) {
            flvPlayer.pause();
            flvPlayer.unload();
            flvPlayer.detachMediaElement();
            flvPlayer.destroy();
            flvPlayer = null;
        }

        videoElement.muted = false;
        videoElement.volume = 1.0;

        if (window.mpegts && mpegts.getFeatureList().mseLivePlayback) {
            flvPlayer = mpegts.createPlayer({
                type: 'flv',
                isLive: true,
                hasAudio: true,
                hasVideo: true,
                url: url
            }, {
                enableStashBuffer: true,
                stashInitialSize: 512 * 1024,
                liveBufferLatencyChasing: false,
                autoCleanupSourceBuffer: true,
                enableWorker: false,
                lazyLoad: false
            });

            flvPlayer.attachMediaElement(videoElement);
            flvPlayer.load();
            
            flvPlayer.play().catch(err => {
                console.warn('播放受阻，降級靜音播放', err);
                videoElement.muted = true;
                flvPlayer.play().catch(e => console.log(e));
            });
        } else {
            // 備用原生 HTML5 播放
            videoElement.src = url;
            videoElement.play().catch(e => {
                videoElement.muted = true;
                videoElement.play();
            });
        }
    }

    // 返回鍵 / Esc 退出內建全屏
    window.addEventListener('keydown', (e) => {
        if (e.keyCode === 27 || e.keyCode === 4 || e.key === 'Escape' || e.key === 'Backspace') {
            const playerBox = document.getElementById('playerBox');
            if (playerBox.classList.contains('fullscreen-mode')) {
                e.preventDefault();
                if (flvPlayer) {
                    flvPlayer.pause();
                    flvPlayer.unload();
                    flvPlayer.detachMediaElement();
                    flvPlayer.destroy();
                    flvPlayer = null;
                }
                const videoElement = document.getElementById('videoElement');
                videoElement.pause();
                videoElement.src = "";

                playerBox.classList.remove('fullscreen-mode');
                document.body.classList.remove('fullscreen-active');
                document.getElementById('statusText').innerText = '已退出播放，請選擇頻道';
            }
        }
    });
</script>

</body>
</html>
