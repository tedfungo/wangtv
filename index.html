<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="renderer" content="webkit">
    <meta name="force-rendering" content="webkit">
    <meta name="x5-fullscreen" content="true">
    <meta name="x5-page-mode" content="app">
    <title>黃敬波播放器-純WebView頂級高清版</title>
    <script src="cordova.js"></script>
    <script src="mpegts.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 24px;
            background-color: #121212;
            color: #ffffff;
            overflow-x: hidden;
        }

        body.fullscreen-active {
            padding: 0 !important;
            overflow: hidden !important;
            background-color: #000;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h4 {
            margin: 0 0 16px 0;
            font-size: 24px;
            color: #ffeb3b;
        }

        .status {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 20px;
        }

        /* 頻道按鈕網格排版（專為電視盒遙控器優化） */
        .btn-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        button.channel-btn {
            padding: 24px;
            font-size: 20px;
            background-color: #1e1e1e;
            color: white;
            border: 3px solid #333;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            outline: none;
            transition: all 0.15s ease-in-out;
        }

        button.channel-btn:focus, button.channel-btn:hover {
            background-color: #1565c0;
            border-color: #ffeb3b;
            box-shadow: 0 0 20px rgba(255, 235, 59, 0.7);
            transform: scale(1.02);
        }

        /* 全屏頂級高清播放容器 */
        .player-box {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 99999;
        }

        .player-box.active {
            display: block !important;
        }

        /* 確保影片畫面強制以最高清、硬體加速、原比例渲染 */
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            -webkit-transform: translate3d(0,0,0);
            transform: translate3d(0,0,0);
        }

        video::-webkit-media-controls {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <h4><img src="icon.png" alt="圖標" style="width: 36px; height: 36px; vertical-align: middle; margin-right: 8px;"> 黃敬波專線 <-- 有事找他(主謀)</h4>
    <div class="status" id="statusText">正在從伺服器同步最新頻道清單...</div>

    <!-- 頻道按鈕動態生成區域 -->
    <div class="btn-list" id="btnList"></div>
</div>

<!-- 頂級高清全屏播放彈窗 -->
<div class="player-box" id="playerBox">
    <video id="videoElement" playsinline webkit-playsinline autoplay></video>
</div>

<script>
    let flvPlayer = null;
    let isPlayingInternal = false;
    const DATA_JS_URL = 'http://n6000.lithoconcepts.com:7222/data.js';

    window.addEventListener('DOMContentLoaded', () => {
        loadRemoteData();
    });

    function loadRemoteData() {
        const statusText = document.getElementById('statusText');
        statusText.innerText = '正在從伺服器同步最新頻道清單...';

        const script = document.createElement('script');
        script.src = DATA_JS_URL + '?t=' + new Date().getTime(); 
        
        const timer = setTimeout(() => {
            statusText.innerText = '同步超時：請檢查電視網路連線';
        }, 5000);

        script.onload = () => clearTimeout(timer);
        script.onerror = (err) => {
            clearTimeout(timer);
            statusText.innerText = '遠端清單同步失敗：網路請求受阻';
            console.error('Script load error:', err);
        };

        document.head.appendChild(script);
    }

    function loadChannelData(text) {
        const statusText = document.getElementById('statusText');
        const btnList = document.getElementById('btnList');
        btnList.innerHTML = '';

        const lines = text.trim().split('\n');
        let count = 0;

        lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) return;

            const parts = trimmed.split(';');
            if (parts.length >= 2) {
                const name = parts[0].trim();
                const url = parts.slice(1).join(';').trim();

                const btn = document.createElement('button');
                btn.className = 'channel-btn';
                btn.innerText = '📺 ' + name;
                btn.onclick = () => startTopQualityPlayer(url, name);
                btnList.appendChild(btn);
                count++;
            }
        });

        if (count > 0) {
            statusText.innerText = '請選擇頻道';
            const firstBtn = btnList.querySelector('.channel-btn');
            if (firstBtn) firstBtn.focus();
        } else {
            statusText.innerText = '頻道清單內容為空';
        }
    }

    // 點擊直接以最高解析度、純 WebView 全屏解碼播放
    function startTopQualityPlayer(url, name) {
        const playerBox = document.getElementById('playerBox');
        const videoElement = document.getElementById('videoElement');
        const statusText = document.getElementById('statusText');

        statusText.innerText = '正在以最高畫質全屏播放： ' + name;
        playerBox.classList.add('active');
        document.body.classList.add('fullscreen-active');
        isPlayingInternal = true;

        if (flvPlayer) {
            flvPlayer.pause();
            flvPlayer.unload();
            flvPlayer.detachMediaElement();
            flvPlayer.destroy();
            flvPlayer = null;
        }

        videoElement.muted = false;
        videoElement.volume = 1.0;

        // 檢查並啟用最高效能的 mpegts / MSE 解碼，追求零延遲與最高原畫解析度
        if (window.mpegts && mpegts.getFeatureList().mseLivePlayback) {
            flvPlayer = mpegts.createPlayer({
                type: 'flv',
                isLive: true,
                hasAudio: true,
                hasVideo: true,
                url: url
            }, {
                enableStashBuffer: false,          // 關閉緩存堆疊，追求最低延遲與即時最高清
                stashInitialSize: 128 * 1024,      // 最小初始緩衝，秒開
                liveBufferLatencyChasing: true,    // 即時追趕直播延遲
                autoCleanupSourceBuffer: true,     // 自動清理緩衝避免記憶體溢出
                enableWorker: true,                // 啟用背景獨立執行緒解碼，畫面更流暢不卡頓
                lazyLoad: false
            });

            flvPlayer.attachMediaElement(videoElement);
            flvPlayer.load();
            
            flvPlayer.play().catch(err => {
                console.warn('播放受阻，嘗試靜音自動播放', err);
                videoElement.muted = true;
                flvPlayer.play().catch(e => console.log(e));
            });
        } else {
            // 備用原生 HTML5 串流
            videoElement.src = url;
            videoElement.play().catch(e => {
                videoElement.muted = true;
                videoElement.play();
            });
        }
    }

    // 遙控器返回鍵 / Esc 支援：退出全屏並徹底釋放資源，返回乾淨首頁
    window.addEventListener('keydown', (e) => {
        if (e.keyCode === 27 || e.keyCode === 4 || e.key === 'Escape' || e.key === 'Backspace') {
            if (isPlayingInternal) {
                e.preventDefault();
                const playerBox = document.getElementById('playerBox');
                playerBox.classList.remove('active');
                document.body.classList.remove('fullscreen-active');
                
                if (flvPlayer) {
                    flvPlayer.pause();
                    flvPlayer.unload();
                    flvPlayer.detachMediaElement();
                    flvPlayer.destroy();
                    flvPlayer = null;
                }
                
                const videoElement = document.getElementById('videoElement');
                videoElement.pause();
                videoElement.src = "";
                
                isPlayingInternal = false;
                document.getElementById('statusText').innerText = '已退出播放，請選擇頻道';
                
                // 讓遙控器焦點回到原本的按鈕上
                const firstBtn = document.querySelector('.channel-btn');
                if (firstBtn) firstBtn.focus();
            }
        }
    });
</script>

</body>
</html>
