<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="renderer" content="webkit">
    <meta name="force-rendering" content="webkit">
    <meta name="x5-fullscreen" content="true">
    <meta name="x5-page-mode" content="app">
    <title>黃敬波播放器-電視盒極致全屏版</title>
    <script src="mpegts.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 30px;
            background-color: #121212;
            color: #ffffff;
            overflow-x: hidden;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h4 {
            margin-bottom: 25px;
            font-size: 22px;
            color: #ffeb3b;
        }

        /* 頻道按鈕列表：針對電視遙控器優化的大字與間距 */
        .btn-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 雙列排布，方便電視遙控器上下左右移動 */
            gap: 16px;
        }

        button.channel-btn {
            padding: 22px 24px;
            font-size: 20px;
            background-color: #1e1e1e;
            color: white;
            border: 2px solid #333;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            outline: none;
            box-sizing: border-box;
            transition: all 0.15s ease-in-out;
        }

        /* 電視遙控器焦點高亮：黃框放大，一眼看出目前選到哪一台 */
        button.channel-btn:focus, button.channel-btn:hover {
            background-color: #1565c0;
            border-color: #ffeb3b;
            box-shadow: 0 0 20px rgba(255, 235, 59, 0.6);
            transform: scale(1.02);
        }

        .status {
            margin-top: 20px;
            font-size: 16px;
            color: #888;
        }

        /* 隱藏的全屏播放器容器（未播放時佔 0 空間，不佔畫面） */
        .fullscreen-player-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 99999;
            display: none; /* 預設隱藏 */
            justify-content: center;
            align-items: center;
        }

        .fullscreen-player-layer.active {
            display: flex; /* 點擊後啟動全屏覆蓋 */
        }

        /* 極限畫質優化全屏 Video */
        #videoElement {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            -webkit-transform: translate3d(0,0,0);
            transform: translate3d(0,0,0);
        }

        /* 播放中的載入/狀態提示懸浮字 */
        .osd-status {
            position: absolute;
            top: 20px;
            left: 30px;
            color: rgba(255,255,255,0.7);
            font-size: 18px;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 6px;
            pointer-events: none;
            z-index: 100000;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h4><img src="icon.png" alt="图标" style="width: 40px; height: 40px; vertical-align: middle; margin-right: 12px;"> 黃敬波專線 - 電視台選單</h4>
    <div class="status" id="statusText">請使用遙控器上下左右選擇頻道，按確認鍵播放</div>

    <div class="btn-list" id="channelList">
        <button class="channel-btn" onclick="playFullscreenStream('https://pull-mpeg-hs-cny-f5.douyincdn.com/live/wxxw-3KNpWhZ0lSaCroTIRf32AqSYbUwjAwyruHsc0KnmLY9yXhj7rXECcu39xKd5mFXyUsByfemjtbwjXDeC.flv', 'TVB 無線新聞台')">📺 TVB 無線新聞台</button>
        <button class="channel-btn" onclick="playFullscreenStream('https://pull-mpeg-hs-cny-f5.douyincdn.com/live/fc-LMbEPJe5MloHcHvTs0DXowNztiTYo2GRWYiVFay2sAZ2aS0fGq5Kt0DDbOEz7DNrVLal4xICqjotPlDR.flv', '翡翠台')">📺 翡翠台</button> 
        <button class="channel-btn" onclick="playFullscreenStream('https://pull-mpeg-hs-cny-f5.douyincdn.com/live/mz-aPTLe8wju0pBb0EPZiT1wBoCkL566W82rJASM9YJ8gq8NNkXUO3JbqYgHWWbNGxaireDJpvw0d1PaFTU.flv', '明珠台')">📺 明珠台</button>
        <button class="channel-btn" onclick="playFullscreenStream('https://pull-mpeg-hs-cny-f5.douyincdn.com/live/viu-WaLq7QU9ShukSHJr4y4T8i0dBsztO66q6niwBKsG86utDGp8t7H3cr1oB0VrNxkL9efg3iOLGlGf8AfS.flv', 'ViuTV')">📺 ViuTV</button>
        <button class="channel-btn" onclick="playFullscreenStream('https://pull-mpeg-hs-cny-f5.douyincdn.com/live/viu6-8gdcevMEDtjXMHhJXHP7ziGkkBezFqkpFtA72x8msWRDKvudDTC1VXpsTgqVF2DObATSVpEhjQjy9RnI.flv', 'ViuTV 6')">📺 ViuTV 6</button>
        <button class="channel-btn" onclick="playFullscreenStream('https://pull-mpeg-hs-cny-f5.douyincdn.com/live/76-oUvaxF7M45U9SmoSSOg3f66we7BLzbEeFQvxlraqoUVvZk2JQtFWJJAZ9lfo5QROX7APb6DjmR9Cr1EE.flv', 'HOY76')">📺 HOY76</button>
        <button class="channel-btn" onclick="playFullscreenStream('https://pull-mpeg-hs-cny-f5.douyincdn.com/live/77-UEX24z1szkkYW1MgvLHM2x3dzaLhlIRcGClmIhA2Sqwk3zfZ1Ib6qHLeUDAyzFqUGTbZeymM3aDDutDW.flv', 'HOY77')">📺 HOY77</button>
        <button class="channel-btn" onclick="playFullscreenStream('https://pull-mpeg-hs-cny-f5.douyincdn.com/live/78-kyg843KLeAipWh193dzAxvA5AaogPevepNR9XdaDz6BQMR18AW5zTd5uYuaSAsMJxRu9nw8mcMZJyoBG.flv', 'HOY78 新聞台')">📺 HOY78 新聞台</button>
    </div>
</div>

<!-- 獨立的全屏播放遮罩層 -->
<div class="fullscreen-player-layer" id="playerLayer">
    <div class="osd-status" id="osdStatus">載入中...</div>
    <video id="videoElement" playsinline webkit-playsinline autoplay></video>
</div>

<script>
    let flvPlayer = null;

    // 點擊頻道：直接啟動全屏遮罩並開始播放
    function playFullscreenStream(url, name) {
        const playerLayer = document.getElementById('playerLayer');
        const videoElement = document.getElementById('videoElement');
        const osdStatus = document.getElementById('osdStatus');

        // 顯示全屏層與標題
        playerLayer.classList.add('active');
        osdStatus.innerText = '正在載入：' + name;
        osdStatus.style.display = 'block';

        // 3 秒後自動隱藏左上角狀態提示，打造乾淨的電視觀影體驗
        setTimeout(() => {
            osdStatus.style.display = 'none';
        }, 3000);

        if (flvPlayer) {
            flvPlayer.pause();
            flvPlayer.unload();
            flvPlayer.detachMediaElement();
            flvPlayer.destroy();
            flvPlayer = null;
        }

        videoElement.muted = false;
        videoElement.volume = 1.0;

        if (window.mpegts && mpegts.getFeatureList().mseLivePlayback) {
            flvPlayer = mpegts.createPlayer({
                type: 'flv',
                isLive: true,
                hasAudio: true,
                hasVideo: true,
                url: url
            }, {
                enableStashBuffer: true,
                stashInitialSize: 512 * 1024,
                liveBufferLatencyChasing: false,
                autoCleanupSourceBuffer: true,
                enableWorker: false,
                lazyLoad: false
            });

            flvPlayer.attachMediaElement(videoElement);
            flvPlayer.load();
            
            flvPlayer.play().catch(err => {
                console.warn('自動播放受阻，嘗試靜音播放', err);
                videoElement.muted = true;
                flvPlayer.play().catch(e => console.log(e));
            });
        }
    }

    // 退出全屏播放並回到選台頁
    function exitFullscreen() {
        const playerLayer = document.getElementById('playerLayer');
        const videoElement = document.getElementById('videoElement');

        if (playerLayer.classList.contains('active')) {
            if (flvPlayer) {
                flvPlayer.pause();
                flvPlayer.unload();
                flvPlayer.detachMediaElement();
                flvPlayer.destroy();
                flvPlayer = null;
            }
            videoElement.pause();
            videoElement.src = '';
            
            playerLayer.classList.remove('active');
        }
    }

    // 監聽電視遙控器按鈕（返回鍵、Esc、Backspace）
    window.addEventListener('keydown', (e) => {
        // 遙控器返回鍵代碼通常為 4 或 Esc (27) / Backspace
        if (e.keyCode === 27 || e.keyCode === 4 || e.key === 'Escape' || e.key === 'Backspace') {
            const playerLayer = document.getElementById('playerLayer');
            if (playerLayer.classList.contains('active')) {
                e.preventDefault(); // 阻止 App 直接被關閉
                exitFullscreen();   // 關閉全屏播放，退回選台頁
            }
        }
    });

    // 頁面載入後自動將焦點放在第一個頻道按鈕上，方便遙控器直接操作
    window.addEventListener('DOMContentLoaded', () => {
        const firstBtn = document.querySelector('.channel-btn');
        if (firstBtn) {
            firstBtn.focus();
        }
    });
</script>

</body>
</html>
