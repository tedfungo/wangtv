name: Build Custom Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project & Add WebIntent Plugin
        run: |
          cordova create myApp com.hjbe.player "黃敬波播放器"
          cd myApp
          cordova platform add android@13.0.0
          
          # 🚀 關鍵：安裝 WebIntent 原生外掛
          cordova plugin add cordova-plugin-webintent
          
          sed -i '/<\/widget>/i \    <preference name="Fullscreen" value="true" \/>' config.xml

      - name: Inject Hardware Acceleration Preference
        run: |
          if [ -f myApp/config.xml ]; then
            sed -i '/<\/widget>/i \    <preference name="HardwareAcceleration" value="true" />' myApp/config.xml
          fi

      - name: Copy Web Files and Icon
        run: |
          rm -rf myApp/www/*
          cp index.html myApp/www/
          cp mpegts.min.js myApp/www/
          
          if [ -f icon.png ]; then
            cp icon.png myApp/www/icon.png
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' myApp/config.xml
          fi

      - name: Allow HTTP Cleartext Traffic for Android 9+
        run: |
          find . -name "AndroidManifest.xml" -exec sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' {} +

      - name: Build Android APK
        run: |
          cd myApp
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 黃敬波播放器-遙遙領先版
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
