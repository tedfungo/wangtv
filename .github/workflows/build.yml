name: Build Custom Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project & Add WebIntent Plugin
        run: |
          cordova create myApp com.hjbe.player "黃敬波播放器"
          cd myApp
          cordova platform add android@13.0.0
          
          # 🚀 安裝 WebIntent 原生外掛
          cordova plugin add cordova-plugin-webintent
          
          # 1. 設定全螢幕、硬體加速與白名單
          sed -i '/<\/widget>/i \    <preference name="Fullscreen" value="true" \/>' config.xml
          sed -i '/<\/widget>/i \    <preference name="HardwareAcceleration" value="true" \/>' config.xml
          sed -i '/<\/widget>/i \    <access origin="*" \/>' config.xml
          sed -i '/<\/widget>/i \    <allow-navigation href="*" \/>' config.xml
          sed -i '/<\/widget>/i \    <allow-intent href="http:\/\/*\/*" \/>' config.xml
          sed -i '/<\/widget>/i \    <preference name="Scheme" value="http" \/>' config.xml

          # 2. 直接在這裡安全注入明文 HTTP 權限（避開 config.xml 解析錯誤）
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' platforms/android/app/src/main/AndroidManifest.xml
      
      - name: Inject Hardware Acceleration Preference
        run: |
          if [ -f myApp/config.xml ]; then
            sed -i '/<\/widget>/i \    <preference name="HardwareAcceleration" value="true" />' myApp/config.xml
          fi

      - name: Copy Web Files and Icon
        run: |
          rm -rf myApp/www/*
          cp index.html myApp/www/
          cp mpegts.min.js myApp/www/
          
          if [ -f icon.png ]; then
            cp icon.png myApp/www/icon.png
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' myApp/config.xml
          fi

      - name: Build Android APK
        run: |
          cd myApp
          # 刪掉重複的 cordova platform add android@latest
          
          # 直接注入明文權限
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' platforms/android/app/src/main/AndroidManifest.xml
          
          # 直接進行編譯
          cordova build android --debug
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 黃敬波播放器-遙遙領先版
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
